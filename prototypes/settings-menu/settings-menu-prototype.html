<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Tracked by bd slugtale-ai3e.

  Question: what should the Settings window look like, with settings grouped by
  what the user is trying to do, and the theme following the OS light/dark mode?

  Verdict so far: variant A (Sidebar + search) won over B (Dictation pipeline)
  and C (Home tiles). B and C are removed; this file now refines A only. Everything is in-memory stub data: no Tauri, no
  saving. Lives outside src/ so it can never ship (tests/runtime-frontend).

  Run:  open prototypes/settings-menu/settings-menu-prototype.html
  URL params: scheme=system|light|dark,
        state=ready|fresh.
-->
<html lang="en" data-scheme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROTOTYPE · Slugtale Settings menu</title>
<style>
  /* ---------- tokens: light-dark() follows color-scheme, which follows the OS ---------- */
  :root {
    color-scheme: light dark;
    --desk: light-dark(#d9dee3, #0b0d10);
    --desk-2: light-dark(#c7d2dc, #1b2230);
    --bg: light-dark(#eef0ef, #17191c);
    --surface: light-dark(#ffffff, #212529);
    --surface-2: light-dark(#f6f7f5, #1a1d20);
    --rail: light-dark(#e9ebec, #141619);
    --text: light-dark(#1f2933, #e9edf0);
    --dim: light-dark(#6c757d, #9aa4ad);
    --faint: light-dark(#8a929a, #79838c);
    --border: light-dark(#e3e6e8, #2c3238);
    --border-2: light-dark(#d4d9dc, #3a4148);
    --accent: light-dark(#2674a6, #4a9fd8);
    --accent-soft: light-dark(#eaf2f8, #1b2a35);
    --ok: light-dark(#2f9e5f, #3fbb75);
    --ok-text: light-dark(#1f7a44, #5ccb8b);
    --warn: light-dark(#e08c2e, #d9a03f);
    --warn-soft: light-dark(#fdf6ec, #2a2115);
    --warn-text: light-dark(#946212, #e0b165);
    --danger: light-dark(#9a3726, #e08072);
    --shadow: light-dark(0 1px 2px rgba(24,34,44,.06), 0 1px 2px rgba(0,0,0,.4));
    --win-shadow: light-dark(0 24px 60px rgba(20,30,40,.28), 0 24px 60px rgba(0,0,0,.6));
    --on-fill: #fff;
    --sw-red: #ff5a52; --sw-amber: #f5a524; --sw-green: #35c76a;
    --sw-blue: #4c9ffe; --sw-violet: #a78bfa; --sw-graphite: #9aa4ad;
    /* group hues for icon tiles */
    --g-shortcut: #6366f1; --g-transcription: #0ea5e9;
    --g-text: #a855f7; --g-bar: #f97316; --g-usage: #22a35a;
    --g-privacy: #64748b; --g-general: #78716c;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
  }
  :root[data-scheme="light"] { color-scheme: light; }
  :root[data-scheme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 700px at 30% 10%, var(--desk-2), var(--desk));
    display: grid; place-items: center; padding: 40px 20px 110px;
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- mock window ---------- */
  .window {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 12px;
    box-shadow: var(--win-shadow);
    overflow: hidden;
    transition: width .25s ease, height .25s ease;
  }
  .window.wide { width: 740px; height: 540px; }
  .titlebar {
    flex: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 7px;
    padding: 0 12px; background: var(--rail); border-bottom: 1px solid var(--border);
    font-size: .76rem; font-weight: 600; color: var(--dim);
  }
  .titlebar i { width: 11px; height: 11px; border-radius: 99px; display: block; }
  .titlebar i:nth-child(1) { background: #ff5f57; }
  .titlebar i:nth-child(2) { background: #febc2e; }
  .titlebar i:nth-child(3) { background: #28c840; }
  .titlebar span { flex: 1; text-align: center; margin-right: 50px; }
  .win-body { flex: 1 1 auto; min-height: 0; position: relative; }
  .size-note { margin-top: 10px; text-align: center; color: var(--faint); font-size: .74rem; }

  /* ---------- shared atoms ---------- */
  svg.i { width: 16px; height: 16px; flex: 0 0 auto; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 28px; padding: 3px 11px; border: 1px solid var(--border-2);
    border-radius: 7px; background: var(--surface); font-size: .84rem; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .btn svg.i { width: 14px; height: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-fill); }
  .btn.ghost { border-color: transparent; background: none; color: var(--accent); padding: 3px 6px; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, .seg button:focus-visible, .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  .seg button { min-height: 24px; padding: 2px 10px; border: 0; border-radius: 6px; background: none; color: var(--dim); font-size: .8rem; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }

  .switch { position: relative; width: 36px; height: 21px; border-radius: 99px; border: 0; background: var(--border-2); cursor: pointer; flex: 0 0 auto; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--ok); }
  .switch[aria-checked="true"]::after { transform: translateX(15px); }
  .switch:disabled { opacity: .45; cursor: not-allowed; }

  .keys { display: inline-flex; gap: 4px; }
  .keys kbd {
    display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px;
    border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 6px;
    background: var(--surface); font-family: inherit; font-size: .8rem; font-weight: 650;
  }
  .keys.big kbd { min-width: 34px; height: 34px; font-size: 1rem; border-radius: 8px; }
  .listening { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border: 1px dashed var(--accent); border-radius: 7px; color: var(--accent); font-size: .8rem; font-weight: 600; }
  .listening::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .swatches { display: inline-flex; gap: 7px; }
  .swatches button { width: 22px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 99px; background: var(--sw); cursor: pointer; }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--sw); }

  select { min-height: 28px; max-width: 220px; border: 1px solid var(--border-2); border-radius: 7px; background: var(--surface); font-size: .84rem; padding: 3px 8px; }
  input[type="number"], input[type="search"] { min-height: 28px; border: 1px solid var(--border-2); border-radius: 7px; background: var(--surface); font-size: .84rem; padding: 3px 8px; }
  input[type="number"] { width: 72px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--border-2); border-radius: 99px; font-size: .76rem; font-weight: 650; white-space: nowrap; color: var(--dim); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--faint); }
  .pill.ok { color: var(--ok-text); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .pill.ok::before { background: var(--ok); }
  .pill.warn { color: var(--warn-text); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.warn::before { background: var(--warn); }

  .chip { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--border); color: var(--dim); font-size: .7rem; font-weight: 650; white-space: nowrap; }
  .chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok-text); }
  .chip.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn-text); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }

  .tile-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: #fff; background: var(--g); flex: 0 0 auto; }
  .tile-icon svg.i { width: 15px; height: 15px; }

  /* rows */
  .row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--border); }
  .row:first-child { border-top: 0; }
  .row-label { font-size: .88rem; font-weight: 600; }
  .row-sub { display: block; margin-top: 1px; color: var(--dim); font-size: .78rem; font-weight: 400; }
  .row-control { display: inline-flex; align-items: center; gap: 8px; justify-self: end; }
  .row.stack { grid-template-columns: 1fr; }
  .row.stack .row-control { justify-self: start; }
  .row[hidden] { display: none; }
  .note { margin: 10px 0 0; color: var(--dim); font-size: .78rem; }

  /* engines */
  .engines { display: grid; gap: 8px; }
  .engine { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; background: var(--surface-2); cursor: pointer; }
  .engine[data-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface-2)); }
  .engine[data-usable="false"] { cursor: default; }
  .engine-head { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 9px; align-items: center; }
  .radio { width: 16px; height: 16px; border-radius: 99px; border: 1.5px solid var(--border-2); background: var(--surface); }
  .engine[data-selected="true"] .radio { border: 5px solid var(--accent); }
  .engine[data-usable="false"] .radio { opacity: .4; }
  .engine-name { font-size: .87rem; font-weight: 650; }
  .engine-desc { margin: 3px 0 0 25px; color: var(--dim); font-size: .77rem; }
  .engine-foot { margin: 7px 0 0 25px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .progress { height: 5px; flex: 1 1 120px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); border-radius: inherit; transition: width .15s; }

  /* cleanup example */
  .example { display: grid; gap: 6px; margin-top: 8px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); font-size: .82rem; }
  .example .lbl { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
  .example .said { color: var(--dim); }
  .example .said s { text-decoration-color: var(--danger); color: var(--faint); }
  .example .typed { white-space: pre-line; font-weight: 550; }

  /* dictation bar preview */
  .screen { position: relative; height: 92px; border-radius: 9px; border: 1px solid var(--border-2); overflow: hidden;
    background: linear-gradient(160deg, light-dark(#b9cde0,#24324a), light-dark(#e9d6c4,#3a2a3a)); }
  .screen::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 9px; background: light-dark(rgba(255,255,255,.6), rgba(0,0,0,.35)); }
  .screen .fakewin { position: absolute; left: 18%; top: 20px; width: 50%; height: 44px; border-radius: 5px; background: light-dark(rgba(255,255,255,.75), rgba(30,34,40,.75)); }
  .mini-bar { position: absolute; bottom: 8px; display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 9px 0 6px; border-radius: 99px;
    background: rgba(20,22,26,.86); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
  .mini-bar.bottom-center { left: 50%; transform: translateX(-50%); }
  .mini-bar.bottom-left { left: 10px; }
  .mini-bar.bottom-right { right: 10px; }
  .mini-bar .orb { width: 10px; height: 10px; border-radius: 99px; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .mini-bar .wave { display: flex; align-items: center; gap: 2px; height: 12px; }
  .mini-bar .wave i { display: block; width: 2px; height: 4px; border-radius: 2px; background: var(--acc); animation: wave 1s ease-in-out infinite; }
  .mini-bar .wave i:nth-child(2) { animation-delay: .1s } .mini-bar .wave i:nth-child(3) { animation-delay: .25s }
  .mini-bar .wave i:nth-child(4) { animation-delay: .4s } .mini-bar .wave i:nth-child(5) { animation-delay: .15s }
  .mini-bar .wave i:nth-child(6) { animation-delay: .3s } .mini-bar .wave i:nth-child(7) { animation-delay: .05s }
  @keyframes wave { 50% { height: 12px; } }

  /* usage */
  .hero { padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); text-align: center; }
  .hero .lbl { margin: 0; color: var(--dim); font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .hero .val { margin: 3px 0 0; font-size: 1.8rem; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; }
  .hero .val.none { color: var(--faint); }
  .hero .sub { margin: 5px 0 0; color: var(--dim); font-size: .78rem; }
  .spans { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
  .span { padding: 11px 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); }
  .span p { margin: 0; }
  .span-label { color: var(--dim); font-size: .72rem; font-weight: 650; }
  .span-saved { margin-top: 2px; font-weight: 700; font-size: 1rem; }
  .span-counts { margin-top: 1px; color: var(--dim); font-size: .74rem; }
  .empty { margin-top: 12px; padding: 12px 14px; border: 1px dashed var(--border-2); border-radius: 10px; color: var(--dim); font-size: .8rem; }
  .confirm { margin-top: 10px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); border-radius: 10px; background: var(--surface-2); font-size: .82rem; }
  .confirm p { margin: 0 0 8px; }
  .confirm div { display: flex; justify-content: flex-end; gap: 8px; }

  .scheme-now { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: 650; }
  .scheme-now svg.i { width: 14px; height: 14px; }

  .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 86%; padding: 7px 12px; border-radius: 9px;
    background: var(--text); color: var(--surface); font-size: .78rem; font-weight: 550; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 20; animation: toast-in .2s ease; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } }

  .scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }

  /* =================== Sidebar + search =================== */
  .a { display: grid; grid-template-columns: 214px minmax(0,1fr); height: 100%; background: var(--surface); }
  .a-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 10px; background: var(--rail); border-right: 1px solid var(--border); }
  .a-search { position: relative; }
  .a-search svg.i { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; color: var(--faint); }
  .a-search input { width: 100%; padding-left: 28px; border-color: var(--border); background: var(--surface); }
  /* Ready or not, nothing more. Where the problems are is the nav's job. */
  .a-ready { display: flex; align-items: center; gap: 7px; padding: 0 6px; font-size: .8rem; font-weight: 650; color: var(--ok-text); }
  .a-ready svg.i { width: 15px; height: 15px; }
  .a-ready.warn { color: var(--warn-text); }
  .a-nav { display: grid; gap: 1px; overflow: auto; }
  .a-nav h6 { margin: 8px 8px 3px; color: var(--faint); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .a-nav h6:first-child { margin-top: 0; }
  .a-nav button { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; width: 100%; padding: 4px 8px 4px 5px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: .84rem; font-weight: 550; cursor: pointer; }
  .a-nav button .tile-icon { width: 22px; height: 22px; border-radius: 6px; }
  .a-nav button .tile-icon svg.i { width: 13px; height: 13px; }
  .a-nav button[data-active="true"] { background: var(--accent); color: var(--on-fill); }
  .a-issues { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px 1px 5px; border-radius: 99px; background: var(--warn-soft); color: var(--warn-text); font-size: .72rem; font-weight: 750; }
  .a-issues svg.i { width: 12px; height: 12px; }
  .a-nav button[data-active="true"] .a-issues { background: rgba(255,255,255,.22); color: var(--on-fill); }
  /* The setting that is the problem, marked on its own page. */
  .row.issue .row-label::before { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 6px 1px 0; border-radius: 99px; background: var(--warn); }
  .a-main { display: flex; flex-direction: column; min-height: 0; }
  .a-head { display: flex; align-items: center; gap: 11px; padding: 16px 22px 10px; }
  .a-head .tile-icon { width: 32px; height: 32px; border-radius: 9px; }
  .a-head h1 { margin: 0; font-size: 1.3rem; letter-spacing: -.02em; }
  .a-head p { margin: 0; color: var(--dim); font-size: .8rem; }
  .a-body { flex: 1; min-height: 0; padding: 4px 22px 22px; }
  .a-card { margin-top: 12px; padding: 2px 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); }
  .a-card.pad { padding: 12px 14px; }
  .a-card-title { margin: 16px 2px 0; color: var(--dim); font-size: .74rem; font-weight: 700; }
  .a-card-title:first-child { margin-top: 4px; }
  .a-card .row { border-color: var(--border); }
  .a-result-group { margin: 14px 2px 0; display: flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; color: var(--dim); }
  .a-result-group .tile-icon { width: 18px; height: 18px; border-radius: 5px; }
  .a-result-group .tile-icon svg.i { width: 11px; height: 11px; }
  .a-noresult { margin-top: 40px; text-align: center; color: var(--dim); }
  mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; }

  /* =================== prototype switcher (not part of the design) =================== */
  .proto-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100;
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 999px;
    background: #111; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12);
    font: 600 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif; white-space: nowrap; color-scheme: dark; }
  .proto-bar button { border: 0; background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .proto-bar button:hover { background: rgba(255,255,255,.18); }
  .proto-bar button[aria-pressed="true"] { background: #fff; color: #111; }
  .proto-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
  .proto-bar .grp { display: inline-flex; gap: 2px; align-items: center; }
  .proto-bar .tag { color: #f5a524; font-weight: 800; letter-spacing: .06em; padding: 0 4px; }
  .proto-state { position: fixed; right: 16px; bottom: 70px; z-index: 99; width: 300px; max-height: 60vh; overflow: auto; margin: 0; padding: 10px 12px;
    border-radius: 10px; background: #111; color: #cfe3ff; font: 11px/1.4 ui-monospace, SFMono-Regular, monospace; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
</style>
</head>
<body>
  <div>
    <div id="window" class="window wide">
      <div class="titlebar"><i></i><i></i><i></i><span>Slugtale Settings</span></div>
      <div id="app" class="win-body"></div>
    </div>
    <p class="size-note">740 × 540 — wider than today's 480 × 520 window</p>
  </div>
  <div id="proto-bar" class="proto-bar"></div>
  <pre id="proto-state" class="proto-state" hidden></pre>

<script>
/* ============================================================

const SCENARIOS = {

const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;

const A_NAV = [

function afterA() {
  if (!UI.query) return;
  const q = UI.query.toLowerCase().trim();
  let any = false;
  document.querySelectorAll(".a-body section").forEach((sec) => {
    let hit = false;
    sec.querySelectorAll(".row").forEach((r) => { const m = r.dataset.search.includes(q); r.hidden = !m; hit ||= m; });
    sec.querySelectorAll(".a-card").forEach((c) => { c.hidden = c.querySelectorAll(".row:not([hidden])").length === 0; });
    sec.querySelectorAll(".engines,.example,.hero,.spans,.empty,.confirm,.a-card.pad,.a-card-title,.note").forEach((x) => (x.hidden = true));
    sec.hidden = !hit; any ||= hit;
  });
  document.querySelector(".a-noresult").hidden = any;
}

function syncUrl() {
  const p = new URLSearchParams();
  if (UI.scheme !== "system") p.set("scheme", UI.scheme);
  if (UI.scenario !== "ready") p.set("state", UI.scenario);
  history.replaceState(null, "", `?${p}`);
}

function render() {
  document.documentElement.dataset.scheme = UI.scheme;
  const app = document.getElementById("app");
  const kept = {};
  app.querySelectorAll("[data-keep]").forEach((el) => (kept[el.dataset.keep] = el.scrollTop));
  const focusId = document.activeElement?.id;
  const caret = document.activeElement?.selectionStart;

  app.innerHTML = renderA() + (UI.toast ? `<div class="toast">${UI.toast}</div>` : "");
  afterA();
  app.querySelectorAll("[data-keep]").forEach((el) => { if (kept[el.dataset.keep]) { el.style.scrollBehavior = "auto"; el.scrollTop = kept[el.dataset.keep]; el.style.scrollBehavior = ""; } });
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }

  renderBar();
  const st = document.getElementById("proto-state");
  st.hidden = !UI.showState;
  if (UI.showState) st.textContent = JSON.stringify({ scheme: { chosen: UI.scheme, effective: effectiveScheme() }, scenario: UI.scenario, readiness: readiness().map((r) => `${r.ready ? "✓" : "✗"} ${r.label}`), settings: { ...S, engines: Object.fromEntries(Object.entries(S.engines).map(([k, e]) => [k, { installed: e.installed, progress: e.progress }])) } }, null, 2);
  syncUrl();
}

function renderBar() {
  const b = (act, arg, label, pressed) => `<button data-proto="${act}" data-arg="${arg}" ${pressed !== undefined ? `aria-pressed="${pressed}"` : ""}>${label}</button>`;
  document.getElementById("proto-bar").innerHTML = `<span class="tag">PROTOTYPE</span>
    <span class="sep"></span><span class="grp">${["system", "light", "dark"].map((s) => b("scheme", s, s === "system" ? `System (${systemDark() ? "dark" : "light"})` : s[0].toUpperCase() + s.slice(1), UI.scheme === s)).join("")}</span>
    <span class="sep"></span><span class="grp">${b("scenario", "ready", "Set up", UI.scenario === "ready")}${b("scenario", "fresh", "Fresh install", UI.scenario === "fresh")}</span>
    <span class="sep"></span>${b("state", "", "{ }", UI.showState)}`;
}


let toastTimer;
function toast(msg) {
  UI.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { UI.toast = null; render(); }, 2400);
}

function go(group) {
  UI.query = ""; UI.pageA = group; render();
}

function startInstall(id) {
  const e = S.engines[id];
  if (e.progress !== null || e.installed) return;
  e.progress = 0; render();
  const t = setInterval(() => {
    e.progress = Math.min(100, e.progress + 9 + Math.round(Math.random() * 8));
    if (e.progress >= 100) { clearInterval(t); e.progress = null; e.installed = true; toast(`${e.name} is ready.`); }
    else render();
  }, 180);
}

const ACTIONS = {
  "a-go": (g) => { UI.query = ""; UI.pageA = g; render(); },
  "record-hotkey": (_, el) => { S.recordingHotkey = true; if (!el.closest(".row")) go("shortcut"); render(); },
  "clear-hotkey": () => { S.hotkey = null; render(); },
  "grant-mic": () => { S.mic = true; toast("Prototype: the app opens macOS Privacy here. Marked as allowed."); },
  "grant-text": () => { S.textInsertion = true; toast("Prototype: the app opens Accessibility here. Marked as allowed."); },
  install: (id, el) => { if (!el.closest(".engine")) go("transcription"); startInstall(id); },
  remove: (id) => { S.engines[id].installed = false; if (installedCount() < 2) S.secondOpinion = "off"; toast(`${S.engines[id].name} removed.`); },
  reveal: (id) => toast(`Prototype: opens ${S.engines[id].path} in Finder.`),
  "pick-engine": (id) => { S.engine = id; render(); },
  "check-update": () => { S.update = "checking"; render(); setTimeout(() => { S.update = "latest"; render(); }, 900); },
  measure: () => { S.challenges += 1; if (S.challenges >= 3) { S.wpm = 43; S.estimate = null; toast("Measured: 43 words per minute."); } else toast(`Challenge ${S.challenges} of 3 done.`); },
  redo: () => { S.wpm = null; S.challenges = 0; render(); },
  "confirm-cancel": () => { UI.confirm = null; render(); },
  "confirm-stop": () => { UI.confirm = null; S.storeUsage = false; render(); }
};

document.addEventListener("click", (ev) => {
  const p = ev.target.closest("[data-proto]");
  if (p) {
    const { proto, arg } = p.dataset;
    if (proto === "scheme") { UI.scheme = arg; render(); }
    if (proto === "scenario") { UI.scenario = arg; S = SCENARIOS[arg](); UI.confirm = null; UI.pageA = firstPage(); render(); }
    if (proto === "state") { UI.showState = !UI.showState; render(); }
    return;
  }
  const set = ev.target.closest("[data-set]");
  if (set && !set.disabled) { S[set.dataset.set] = set.dataset.value; render(); return; }
  const tg = ev.target.closest("[data-toggle]");
  if (tg && !tg.disabled) {
    const k = tg.dataset.toggle;
    if (k === "storeUsage" && S.storeUsage) { UI.confirm = "stop-storing"; render(); return; }
    S[k] = !S[k]; render(); return;
  }
  const act = ev.target.closest("[data-act]");
  if (act && !act.disabled) {
    // A button inside an engine card should not also select the card.
    if (act.dataset.act === "pick-engine" && ev.target.closest("button")) return;
    ACTIONS[act.dataset.act]?.(act.dataset.arg, act);
  }
});

document.addEventListener("input", (ev) => {
  if (ev.target.id === "a-q") { UI.query = ev.target.value; render(); }
});
document.addEventListener("change", (ev) => {
  if (ev.target.dataset.select) { S[ev.target.dataset.select] = ev.target.value; render(); }
  if (ev.target.dataset.number) { const n = parseInt(ev.target.value, 10); S.estimate = n >= 10 && n <= 150 ? n : null; render(); }
});

document.addEventListener("keydown", (ev) => {
  if (S.recordingHotkey) {
    ev.preventDefault();
    if (ev.key === "Escape") { S.recordingHotkey = false; render(); return; }
    if (["Meta", "Control", "Alt", "Shift"].includes(ev.key)) return;
    const mods = [ev.metaKey && "Cmd", ev.ctrlKey && "Ctrl", ev.altKey && "Alt", ev.shiftKey && "Shift"].filter(Boolean);
    if (!mods.length) { toast("Add at least one modifier key, like ⌥ or ⌘."); return; }
    const key = ev.code === "Space" ? "Space" : ev.code.startsWith("Key") ? ev.code.slice(3) : ev.code.startsWith("Digit") ? ev.code.slice(5) : ev.key;
    S.hotkey = [...mods, key].join("+"); S.recordingHotkey = false; render(); return;
  }
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
</body>
</html>
