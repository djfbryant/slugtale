[package]
name = "slugtale"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
local-whisper-runtime = ["dep:whisper-rs", "dep:num_cpus"]
local-whisper-runtime-metal = ["local-whisper-runtime", "whisper-rs/metal"]

[lib]
name = "slugtale_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[example]]
name = "decode_benchmark"
required-features = ["local-whisper-runtime"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16.0", optional = true }
cpal = "0.18.1"
num_cpus = { version = "1.17.0", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

# Windows Platform Adapter (ADR-0021, PRD slugtale-5pc). Mirrors the macOS
# native-dependency block so neither platform pulls the other's crates. The
# windows-sys features cover the Win32 surface the follow-on Windows issues
# fill: SendInput + clipboard (DataExchange/Memory/Ole for CF_UNICODETEXT) for
# text insertion (5pc.3/5pc.4), the microphone
# ConsentStore registry read for readiness (5pc.2), GetForegroundWindow/
# SetForegroundWindow for focus targeting (5pc.5), and PlaySoundW for audible
# feedback (5pc.6). winreg/clipboard-win are folded into windows-sys here.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Media_Audio",
] }

# Linux Platform Adapter — X11 slice (ADR-0021, ADR-0023, PRD slugtale-8ul).
# Mirrors the macOS/Windows native-dependency blocks so no platform pulls
# another's crates. enigo synthesizes text/keystrokes over XTEST (text
# insertion + Ctrl+V paste, 8ul.3); arboard owns the X11 clipboard selection
# for the paste fallback and the insertion rescue (8ul.3/8ul.4); x11rb reads
# and re-activates _NET_ACTIVE_WINDOW for focus targeting (8ul.5); notify-rust
# posts the D-Bus rescue notification (8ul.4). enigo uses its pure-Rust x11rb
# backend (no libxdo C dependency); Wayland/libei backends are added in Phase 2.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
arboard = "3.6"
x11rb = "0.13"
notify-rust = "4"
