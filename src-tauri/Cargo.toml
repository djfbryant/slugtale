[package]
name = "slugtale"
version = "0.1.1"
edition = "2021"
license = "MIT"

[features]
default = []
local-whisper-runtime = ["dep:whisper-rs", "dep:num_cpus"]
local-whisper-runtime-metal = ["local-whisper-runtime", "whisper-rs/metal"]
local-parakeet-runtime = ["dep:parakeet-rs"]
local-phonon-mlx = []
local-parakeet-runtime-coreml = ["local-parakeet-runtime", "parakeet-rs/coreml"]
apple-speech-runtime = []
voice-activation = ["local-whisper-runtime"]

[lib]
name = "slugtale_lib"

[profile.release]
strip = "symbols"

[[example]]
name = "decode_benchmark"
required-features = ["local-whisper-runtime"]

[[example]]
name = "asr_eval"
required-features = ["local-whisper-runtime"]

# Proves, against real macOS, that a built-but-stopped CoreAudio input stream
# does not run the microphone (slugtale-g1o.3): the device's
# kAudioDevicePropertyDeviceIsRunningSomewhere property stays false until the
# stream plays. This is the evidence that lets idle-time preparation build the
# stream without lighting the microphone indicator.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# that right needs the OS timezone database. Already in the dependency tree via
# Tauri, so this makes an existing crate a direct dependency rather than a new
# one. `default-features = false` keeps out serde and oldtime.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10.9"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16.0", optional = true }
cpal = "0.18.1"
num_cpus = { version = "1.17.0", optional = true }
# Parakeet TDT v2 through ONNX Runtime (slugtale-vjs.1). MIT OR Apache-2.0; the
# NVIDIA model weights it loads are CC BY 4.0 and are installed separately by an
# explicit user action, never bundled.
parakeet-rs = { version = "0.3.6", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
open = "5.4.2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "AVCaptureDevice",
    # objc2 0.3.2: AVMediaTypeAudio lives in AVMediaFormat.
    "AVMediaFormat",
    # AVCaptureDevice::requestAccessForMediaType_completionHandler takes an
    # ObjC block, which the generator only emits with block2 enabled.
    "block2",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    # NSRunningApplication::activateWithOptions takes these options
    # (src/macos.rs target activation).
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    # processIdentifier/runningApplicationWithProcessIdentifier are emitted
    # only with libc enabled (pid_t in the generated signatures).
    "libc",
] }
# src/macos.rs week_start). objc2 0.3.2 generates NSCalendar behind this
# feature; NSDate/NSString prerequisites come through the feature graph.
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSCalendar",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Media_Audio",
    "Win32_Globalization",
] }

# another's crates. enigo synthesizes text/keystrokes over XTEST (text
# insertion + Ctrl+V paste, 8ul.3); arboard owns the X11 clipboard selection
# for the paste fallback and the insertion rescue (8ul.3/8ul.4); x11rb reads
# and re-activates _NET_ACTIVE_WINDOW for focus targeting (8ul.5); notify-rust
# posts the D-Bus rescue notification (8ul.4). enigo uses its pure-Rust x11rb
# backend (no libxdo C dependency); Wayland/libei backends are added in Phase 2.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
arboard = "3.6"
x11rb = "0.13"
notify-rust = "4"
