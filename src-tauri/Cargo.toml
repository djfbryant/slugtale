[package]
name = "slugtale"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Every Transcription Engine past Whisper is opt-in at build time (slugtale-vjs).
# Each one drags in a native toolchain — ONNX Runtime for Parakeet, the Swift
# compiler for Apple SpeechTranscriber — that a plain `cargo test` on any
# platform should not need. With none of them enabled the app behaves exactly as
# it did before: one engine, no router, no extra work on the dictation path.
[features]
default = []
local-whisper-runtime = ["dep:whisper-rs", "dep:num_cpus"]
local-whisper-runtime-metal = ["local-whisper-runtime", "whisper-rs/metal"]
# NVIDIA Parakeet TDT v2 0.6B via ONNX Runtime (slugtale-vjs.1). Portable across
# macOS, Windows, and Linux, unlike the Core ML/Swift path the original design
# assumed, so the Linux port inherits it for free.
local-parakeet-runtime = ["dep:parakeet-rs"]
# Parakeet on the Apple Neural Engine / GPU through ONNX Runtime's Core ML
# execution provider. macOS-only; the CPU provider stays the portable default.
local-parakeet-runtime-coreml = ["local-parakeet-runtime", "parakeet-rs/coreml"]
# Apple SpeechTranscriber (slugtale-vjs.2). macOS 26+ only, and gated by
# `cfg(target_os = "macos")` on top of this feature so enabling it on Linux or
# Windows is a no-op rather than a build failure.
apple-speech-runtime = []

[lib]
name = "slugtale_lib": the desktop binary, examples, and tests all link
# the rlib, and no mobile or external FFI consumer exists (slugtale-g1o.10).
# Building cdylib/staticlib cost ~450 MB of debug target-disk per clean build
# for nothing.


[[example]]
name = "decode_benchmark"
required-features = ["local-whisper-runtime"]

# The selective-ASR measurement harness (slugtale-vjs.5). Requires Whisper
# because that is the baseline every other engine is measured against; Parakeet
# and Apple SpeechTranscriber are added on top with their own features when the
# run needs them.
[[example]]
name = "asr_eval"
required-features = ["local-whisper-runtime"]

# Proves, against real macOS, that a built-but-stopped CoreAudio input stream
# does not run the microphone (slugtale-g1o.3): the device's
# kAudioDevicePropertyDeviceIsRunningSomewhere property stays false until the
# stream plays. This is the evidence that lets idle-time preparation build the
# stream without lighting the microphone indicator.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local calendar dates for Daily Usage Records (ADR-0025). Only `Local::now()`
# is used: a Counted Segment belongs to the local date it landed on, and getting
# that right needs the OS timezone database. Already in the dependency tree via
# Tauri, so this makes an existing crate a direct dependency rather than a new
# one. `default-features = false` keeps out serde and oldtime.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10.9"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16.0", optional = true }
cpal = "0.18.1"
num_cpus = { version = "1.17.0", optional = true }
# Parakeet TDT v2 through ONNX Runtime (slugtale-vjs.1). MIT OR Apache-2.0; the
# NVIDIA model weights it loads are CC BY 4.0 and are installed separately by an
# explicit user action, never bundled.
parakeet-rs = { version = "0.3.6", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
# In-app auto-update reading latest.json from GitHub Releases (ADR-0022,
# slugtale-9pr). Signature verification uses the free Tauri updater keypair,
# which is separate from OS code signing. The restart into the new build uses
# the AppHandle's own `restart`, so no process plugin is needed.
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    # Platform Adapter microphone authorization (src/macos.rs AVCaptureDevice).
    "AVCaptureDevice",
    # objc2 0.3.2: AVMediaTypeAudio lives in AVMediaFormat.
    "AVMediaFormat",
    # AVCaptureDevice::requestAccessForMediaType_completionHandler takes an
    # ObjC block, which the generator only emits with block2 enabled.
    "block2",
] }
# The macOS Platform Adapter uses only NSWorkspace (frontmost app), and
# NSRunningApplication with its activation options (target activation). Tauri's
# own windowing crates already enable their AppKit features additively, so the
# union stays correct while Slugtale stops pulling in the rest of AppKit
# (slugtale-g1o.7).
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    # NSRunningApplication::activateWithOptions takes these options
    # (src/macos.rs target activation).
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    # processIdentifier/runningApplicationWithProcessIdentifier are emitted
    # only with libc enabled (pid_t in the generated signatures).
    "libc",
] }
# NSCalendar only: locale week start for Daily Usage Records (ADR-0025,
# src/macos.rs week_start). objc2 0.3.2 generates NSCalendar behind this
# feature; NSDate/NSString prerequisites come through the feature graph.
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSCalendar",
] }

# Windows Platform Adapter (ADR-0021, PRD slugtale-5pc). Mirrors the macOS
# native-dependency block so neither platform pulls the other's crates. The
# windows-sys features cover the Win32 surface the follow-on Windows issues
# fill: SendInput + clipboard (DataExchange/Memory/Ole for CF_UNICODETEXT) for
# text insertion (5pc.3/5pc.4), the microphone
# ConsentStore registry read for readiness (5pc.2), GetForegroundWindow/
# SetForegroundWindow for focus targeting (5pc.5), and PlaySoundW for audible
# feedback (5pc.6). winreg/clipboard-win are folded into windows-sys here.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Media_Audio",
    # GetLocaleInfoEx, for the locale's first day of the week (ADR-0025).
    "Win32_Globalization",
] }

# Linux Platform Adapter — X11 slice (ADR-0021, ADR-0023, PRD slugtale-8ul).
# Mirrors the macOS/Windows native-dependency blocks so no platform pulls
# another's crates. enigo synthesizes text/keystrokes over XTEST (text
# insertion + Ctrl+V paste, 8ul.3); arboard owns the X11 clipboard selection
# for the paste fallback and the insertion rescue (8ul.3/8ul.4); x11rb reads
# and re-activates _NET_ACTIVE_WINDOW for focus targeting (8ul.5); notify-rust
# posts the D-Bus rescue notification (8ul.4). enigo uses its pure-Rust x11rb
# backend (no libxdo C dependency); Wayland/libei backends are added in Phase 2.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
arboard = "3.6"
x11rb = "0.13"
notify-rust = "4"
