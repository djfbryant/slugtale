name: Project checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          curl \
          file \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libglib2.0-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          pkg-config \
          wget
    - name: Install dependencies
      run: npm install
    - name: Run project checks
      run: npm test
    - name: Compile the examples
      run: npm run check:examples

  checks-windows:
    # windows.rs only compiles and runs on a Windows target, and Wine/cross-checks
    # from macOS cannot exercise it faithfully (ConsentStore registry, UIPI,
    # WASAPI). This job compiles the whole crate — including the cfg-gated
    runs-on: windows-latest

    defaults:
      run:
        # Git Bash, so run-cargo.js resolves cargo from a POSIX-style PATH,
        # same as the Linux job.
        shell: bash

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install
    - name: Run project checks
      run: npm test
    - name: Compile the examples
      run: npm run check:examples
    - name: Build the Whisper runtime under MSVC
      run: npm run test:whisper-build

  checks-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install
    - name: Run project checks
      run: npm test
    - name: Compile the examples
      # The Apple-only acceleration features (Metal, Core ML) cannot build off
      # macOS, so this job uses the wider set: it covers asr_eval *and* the
      run: npm run check:examples:apple
    - name: Check the Phonon MLX provider
      run: npm run test:phonon-mlx
    - name: Compile and test Voice Activation
      run: npm run test:voice-activation
