<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slugtale Dictation</title>
  <link rel="stylesheet" href="dictation-bar.css" />
</head>
<body data-phase="recording" data-position="bottom-center" data-expanded="false" data-reason="none">
  <div class="bar" role="group" aria-label="Dictation in progress">
    <span class="orb">
      <span id="halo" class="halo" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
      </svg>
    </span>
    <span class="tail">
      <span class="wave" aria-hidden="true">
        <svg viewBox="0 0 160 26" preserveAspectRatio="none">
          <path id="envelope"/>
        </svg>
      </span>
      <span id="label" class="label" aria-live="polite">Recording</span>
      <span id="elapsed" class="elapsed" aria-hidden="true">0:00</span>
      <span class="controls">
        <button id="stop" class="stop" type="button" title="Stop dictation" aria-label="Stop dictation">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
        <button id="cancel" class="cancel" type="button" title="Cancel dictation (Esc)" aria-label="Cancel dictation">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </span>
    </span>
  </div>

  <script src="dictation-bar.js"></script>
</body>
</html>
