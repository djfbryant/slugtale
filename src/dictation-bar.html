<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slugtale Dictation</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      /* The window is transparent; only the pill paints, so it floats like the
         resident dictation bars in FluidVoice and Wispr Flow. */
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 100%;
      margin: 6px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(24, 27, 31, 0.92);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
      color: #f3f5f6;
    }

    /* Animated recording indicator: a pulsing dot beside three bouncing bars,
       communicating that Slugtale is capturing audio. No transcript text (v1). */
    .indicator {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #ff5a52;
      box-shadow: 0 0 0 0 rgba(255, 90, 82, 0.6);
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 90, 82, 0.55); }
      70% { box-shadow: 0 0 0 9px rgba(255, 90, 82, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 90, 82, 0); }
    }

    .wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
    }

    .wave span {
      width: 3px;
      height: 6px;
      border-radius: 999px;
      background: #aeb6bc;
      animation: bounce 1s ease-in-out infinite;
    }

    .wave span:nth-child(2) { animation-delay: 0.12s; }
    .wave span:nth-child(3) { animation-delay: 0.24s; }
    .wave span:nth-child(4) { animation-delay: 0.36s; }
    .wave span:nth-child(5) { animation-delay: 0.48s; }

    @keyframes bounce {
      0%, 100% { height: 6px; opacity: 0.5; }
      50% { height: 18px; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      .wave span { animation: none; height: 12px; opacity: 0.8; }
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #f3f5f6;
      cursor: pointer;
      padding: 0;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    button.stop {
      background: #2f9e5f;
      color: #ffffff;
    }

    button.stop:hover {
      background: #36b06b;
    }

    button svg {
      width: 15px;
      height: 15px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="bar" role="group" aria-label="Dictation in progress">
    <div class="indicator">
      <span class="dot" aria-hidden="true"></span>
      <span class="wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </span>
      <span class="sr-only" aria-live="polite">Recording</span>
    </div>
    <div class="controls">
      <button id="stop" class="stop" type="button" title="Stop dictation" aria-label="Stop dictation">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button id="cancel" class="cancel" type="button" title="Cancel dictation (Esc)" aria-label="Cancel dictation">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <script>
    function invoke(command, args) {
      const core = window.__TAURI__ && window.__TAURI__.core;
      if (!core || typeof core.invoke !== "function") return Promise.resolve();
      return core.invoke(command, args).catch((error) => {
        console.error("dictation_event failed", error);
      });
    }

    function stop() {
      invoke("dictation_event", { event: "stop" });
    }

    function cancel() {
      invoke("dictation_event", { event: "cancel" });
    }

    document.getElementById("stop").addEventListener("click", stop);
    document.getElementById("cancel").addEventListener("click", cancel);

    // Escape cancels the dictation and discards it (ADR-0014).
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        cancel();
      }
    });
  </script>
</body>
</html>
