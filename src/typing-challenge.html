<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slugtale Typing Challenge</title>
  <link rel="stylesheet" href="typing-challenge.css" />
</head>
<body>
  <header>
    <div>
      <h1 id="title">Typing challenge</h1>
      <p id="subtitle" class="sub">Type the passage as accurately as you can. Corrections are fine.</p>
    </div>
    <div id="clock" class="clock" data-running="false">30</div>
  </header>

  <section id="run">
    <p id="passage" class="passage"></p>
  </section>

  <textarea id="typing" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
            aria-label="Type the passage here" placeholder="Start typing to begin the thirty seconds…"></textarea>

  <section id="done" class="done" hidden>
    <p class="note">Your typing speed</p>
    <p id="done-value" class="done-value">—</p>
    <p id="done-note" class="note"></p>
  </section>

  <footer>
    <p id="progress" class="progress-text">Challenge 1 of 3</p>
    <span class="actions">
      <button id="abort" type="button" hidden>Start over</button>
      <button id="next" type="button" class="primary" hidden>Next challenge</button>
      <button id="close" type="button">Close</button>
    </span>
  </footer>

  <p id="message" class="note" aria-live="polite"></p>

  <script src="settings/tauri-bridge.js"></script>
  <script src="typing-challenge.js"></script>
</body>
</html>
