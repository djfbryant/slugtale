<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROTOTYPE — Slugtale settings layouts</title>
  <!--
    THROWAWAY PROTOTYPE — not shipped, not loaded by the app. Delete once a layout wins.
    Tracked by bd issue slugtale-dsi.

    Round 2. Round 1 asked which shape; two-pane won. This round asks what a
    modern two-pane looks like, and pins down dark mode.

      ?variant=B0|B1|B2|B3   B0 is round 1's two-pane, kept for comparison
      ?state=fresh|ready     first-run machine vs configured machine
      ?theme=auto|light|dark

    Every colour goes through a token in :root / [data-theme="dark"] — that token
    set is the part meant to survive into src/index.html, whichever layout wins.

    All state is in-memory fixtures. No Tauri invokes, no saving.
  -->
  <style>
    /* ---------- tokens ---------- */

    :root {
      --bg: #eef0ef;
      --surface: #ffffff;
      --surface-sunken: #f6f7f5;
      --rail: #e9ebec;
      --rail-active: #2674a6;
      --rail-active-text: #ffffff;
      --text: #1f2933;
      --text-dim: #6c757d;
      --text-faint: #8a929a;
      --border: #e3e6e8;
      --border-strong: #d4d9dc;
      --accent: #2674a6;
      --accent-soft: #eaf2f8;
      --ok: #2f9e5f;
      --ok-soft: #f0f8f3;
      --ok-text: #1f7a44;
      --warn: #e08c2e;
      --warn-soft: #fdf6ec;
      --warn-text: #946212;
      --danger: #9a3726;
      --shadow: 0 1px 2px rgba(24, 34, 44, 0.06);
      --titlebar: #ececec;

      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    [data-theme="dark"] {
      --bg: #17191c;
      --surface: #212529;
      --surface-sunken: #1a1d20;
      --rail: #141619;
      --rail-active: #3d8fc4;
      --rail-active-text: #ffffff;
      --text: #e9edf0;
      --text-dim: #9aa4ad;
      --text-faint: #79838c;
      --border: #2c3238;
      --border-strong: #3a4148;
      --accent: #4a9fd8;
      --accent-soft: #1b2a35;
      --ok: #3fbb75;
      --ok-soft: #16261d;
      --ok-text: #5ccb8b;
      --warn: #d9a03f;
      --warn-soft: #2a2115;
      --warn-text: #e0b165;
      --danger: #e08072;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --titlebar: #1c1f22;

      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px 110px;
      background: #d5d9dc;
      color: var(--text);
      transition: background 0.15s ease;
    }
    html[data-theme="dark"] body { background: #0d0f11; }

    /* The real settings window: 480x520, not resizable. */
    .window {
      width: 480px;
      height: 520px;
      display: flex;
      flex-direction: column;
      border-radius: 11px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 18px 50px rgba(10, 16, 22, 0.35);
    }

    .titlebar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 12px;
      background: var(--titlebar);
      border-bottom: 1px solid var(--border);
    }
    .light { width: 11px; height: 11px; border-radius: 999px; background: var(--border-strong); }
    .titlebar span { margin-left: 6px; color: var(--text-dim); font-size: 0.78rem; font-weight: 600; }

    .viewport { flex: 1 1 auto; min-height: 0; overflow: auto; }

    /* ---------- shared atoms ---------- */

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-dim);
      font-size: 0.76rem;
      font-weight: 650;
      white-space: nowrap;
    }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--text-faint); }
    .pill[data-ready="true"] { border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok-text); }
    .pill[data-ready="true"]::before { background: var(--ok); }
    .pill[data-ready="false"] { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn-text); }
    .pill[data-ready="false"]::before { background: var(--warn); }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 3px 11px;
      cursor: pointer;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.ghost { border-color: transparent; background: none; color: var(--accent); padding: 3px 7px; }
    button.danger { border-color: color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); background: var(--surface); }

    select, input[type="text"] {
      min-height: 30px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      padding: 4px 8px;
    }
    input[type="checkbox"] { accent-color: var(--accent); width: 36px; height: 20px; }

    .keys { display: inline-flex; gap: 4px; }
    .keys kbd {
      display: grid;
      place-items: center;
      min-width: 23px;
      height: 23px;
      padding: 0 6px;
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 650;
    }
    .keys.big kbd { min-width: 32px; height: 32px; font-size: 0.98rem; border-radius: 8px; }

    .muted { color: var(--text-dim); font-size: 0.81rem; }
    .icon { width: 15px; height: 15px; flex: 0 0 auto; }
    .dot {
      width: 18px; height: 18px; border-radius: 999px;
      display: grid; place-items: center;
      background: var(--border); color: var(--text-dim);
      font-size: 0.68rem; font-weight: 800;
    }
    .dot[data-state="ok"] { background: var(--ok); color: #fff; }
    .dot[data-state="warn"] { background: var(--warn); color: #fff; }

    /* ---------- B0 — round 1 two-pane (kept for comparison) ---------- */

    .b0-wrap { display: grid; grid-template-columns: 138px minmax(0,1fr); height: 100%; }
    .b0-side { background: var(--rail); border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
    .b0-brand { padding: 2px 8px 12px; font-weight: 700; font-size: 0.95rem; }
    .b0-nav {
      display: flex; align-items: center; gap: 8px; width: 100%;
      min-height: 30px; padding: 5px 9px;
      border: 0; border-radius: 7px; background: none;
      color: var(--text); font-size: 0.87rem; font-weight: 600;
      justify-content: flex-start; cursor: pointer;
    }
    .b0-nav[aria-current="true"] { background: var(--rail-active); color: var(--rail-active-text); }
    .b0-badge { margin-left: auto; width: 7px; height: 7px; border-radius: 999px; background: var(--warn); }
    .b0-side .b0-foot { margin-top: auto; padding: 8px; }
    .b0-pane { padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
    .b0-pane h2 { margin: 0; font-size: 1.02rem; font-weight: 650; }
    .b0-field { display: grid; gap: 5px; font-size: 0.85rem; font-weight: 600; }
    .b0-field select, .b0-field input { width: 100%; }
    .b0-check { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .b0-card { border: 1px solid var(--border); border-radius: 9px; background: var(--surface); padding: 12px; display: grid; gap: 9px; }

    /* ---------- B1 — inset grouped (modern native macOS) ---------- */

    .b1-wrap { display: grid; grid-template-columns: 148px minmax(0,1fr); height: 100%; background: var(--bg); }
    .b1-side {
      background: var(--rail);
      border-right: 1px solid var(--border);
      padding: 10px 9px;
      display: flex; flex-direction: column; gap: 1px;
    }
    .b1-nav {
      display: flex; align-items: center; gap: 9px;
      width: 100%; min-height: 29px; padding: 4px 8px;
      border: 0; border-radius: 7px; background: none;
      color: var(--text); font-size: 0.86rem; font-weight: 550;
      justify-content: flex-start; cursor: pointer;
    }
    .b1-nav .icon { color: var(--text-dim); }
    .b1-nav[aria-current="true"] { background: var(--rail-active); color: var(--rail-active-text); font-weight: 600; }
    .b1-nav[aria-current="true"] .icon { color: currentColor; }
    .b1-nav .b1-badge { margin-left: auto; width: 6px; height: 6px; border-radius: 999px; background: var(--warn); }
    .b1-side footer { margin-top: auto; padding: 6px 4px 2px; }

    .b1-main { display: flex; flex-direction: column; min-width: 0; }
    .b1-toolbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px 10px;
    }
    .b1-toolbar h2 { margin: 0; font-size: 1.06rem; font-weight: 680; letter-spacing: -0.01em; }
    .b1-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 16px 16px; }

    .b1-caption { margin: 14px 2px 5px; font-size: 0.73rem; font-weight: 650; color: var(--text-faint); }
    .b1-caption:first-child { margin-top: 0; }
    .b1-group {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .b1-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      min-height: 42px;
    }
    .b1-row + .b1-row { border-top: 1px solid var(--border); }
    .b1-row .label { font-size: 0.88rem; font-weight: 550; }
    .b1-row .sub { display: block; color: var(--text-dim); font-size: 0.78rem; font-weight: 400; }
    .b1-row.stack { grid-template-columns: minmax(0,1fr); gap: 8px; }
    .b1-note { margin: 7px 3px 0; color: var(--text-dim); font-size: 0.78rem; }

    /* ---------- B2 — icon rail + editorial ---------- */

    .b2-wrap { display: grid; grid-template-columns: 62px minmax(0,1fr); height: 100%; }
    .b2-rail {
      background: var(--rail);
      border-right: 1px solid var(--border);
      padding: 10px 0;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .b2-tab {
      position: relative;
      display: grid; place-items: center; gap: 3px;
      width: 48px; padding: 7px 0 6px;
      border: 0; border-radius: 10px; background: none;
      color: var(--text-dim); cursor: pointer;
      font-size: 0.62rem; font-weight: 650; letter-spacing: 0.02em;
      min-height: 0;
    }
    .b2-tab .icon { width: 18px; height: 18px; }
    .b2-tab[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
    .b2-tab .b2-badge {
      position: absolute; top: 5px; right: 9px;
      width: 7px; height: 7px; border-radius: 999px;
      background: var(--warn); border: 1.5px solid var(--rail);
    }
    .b2-rail footer { margin-top: auto; }
    .b2-theme { width: 34px; height: 34px; border-radius: 10px; border: 0; background: none; color: var(--text-dim); display: grid; place-items: center; min-height: 0; }

    .b2-main { display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
    .b2-head { padding: 20px 22px 14px; }
    .b2-head h2 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .b2-head p { margin: 3px 0 0; color: var(--text-dim); font-size: 0.84rem; }
    .b2-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 22px 20px; }
    .b2-line {
      display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 14px;
      padding: 13px 0;
      border-top: 1px solid var(--border);
    }
    .b2-line:first-child { border-top: 0; }
    .b2-line .label { font-size: 0.9rem; font-weight: 600; }
    .b2-line .sub { display: block; color: var(--text-dim); font-size: 0.79rem; font-weight: 400; margin-top: 1px; }
    .b2-hero {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; margin-bottom: 4px;
      border-radius: 12px;
      background: var(--surface-sunken);
      border: 1px solid var(--border);
    }
    .b2-hero .grow { min-width: 0; }
    .b2-hero strong { display: block; font-size: 0.95rem; }
    .b2-seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-sunken); border: 1px solid var(--border); }
    .b2-seg button {
      border: 0; background: none; color: var(--text-dim);
      min-height: 24px; padding: 2px 10px; border-radius: 6px; font-size: 0.8rem;
    }
    .b2-seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

    /* ---------- B3 — dense pro + ambient status bar ---------- */

    .b3-wrap { display: grid; grid-template-rows: minmax(0,1fr) 26px; height: 100%; }
    .b3-body { display: grid; grid-template-columns: 146px minmax(0,1fr); min-height: 0; }
    .b3-side { background: var(--rail); border-right: 1px solid var(--border); padding: 10px 8px; overflow: auto; }
    .b3-group { margin-bottom: 12px; }
    .b3-grouphead { padding: 0 8px 4px; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint); }
    .b3-nav {
      display: flex; align-items: center; gap: 8px; width: 100%;
      min-height: 27px; padding: 3px 8px;
      border: 0; border-left: 2px solid transparent; border-radius: 0 6px 6px 0;
      background: none; color: var(--text); font-size: 0.85rem; font-weight: 550;
      justify-content: flex-start; cursor: pointer;
    }
    .b3-nav[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); color: var(--accent); font-weight: 650; }
    .b3-nav .hint { margin-left: auto; color: var(--text-faint); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 0.7rem; }
    .b3-nav[aria-current="true"] .hint { color: inherit; opacity: 0.7; }
    .b3-nav .b3-badge { margin-left: auto; width: 6px; height: 6px; border-radius: 999px; background: var(--warn); }

    .b3-pane { min-width: 0; overflow: auto; padding: 14px 16px 16px; background: var(--surface); }
    .b3-pane h2 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 680; }
    .b3-row {
      display: grid; grid-template-columns: 118px minmax(0,1fr);
      align-items: center; gap: 10px;
      padding: 7px 8px; margin: 0 -8px;
      border-radius: 7px;
      font-size: 0.85rem;
    }
    .b3-row:hover { background: var(--surface-sunken); }
    .b3-row dt { color: var(--text-dim); }
    .b3-row dd { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; }
    .b3-row .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 0.8rem; color: var(--text-dim); font-weight: 400; overflow-wrap: anywhere; }
    .b3-row button { opacity: 0; transition: opacity 0.1s ease; }
    .b3-row:hover button, .b3-row:focus-within button { opacity: 1; }

    .b3-status {
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px;
      background: var(--rail);
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.73rem; font-weight: 600;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .b3-status .sep { color: var(--border-strong); }
    .b3-status .live { display: inline-flex; align-items: center; gap: 5px; }
    .b3-status .live::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--warn); }
    .b3-status[data-ready="true"] .live::before { background: var(--ok); }
    .b3-status .push { margin-left: auto; }

    /* ---------- warnings (shared shape, variant-tuned spacing) ---------- */

    .warn-row {
      display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 10px;
      padding: 9px 11px;
      border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
      border-radius: 9px;
      background: var(--warn-soft);
      font-size: 0.84rem;
    }
    .warn-row strong { display: block; font-weight: 650; }
    .warn-row small { color: var(--warn-text); }

    /* ---------- prototype switcher (not part of any design) ---------- */

    .switcher {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px;
      padding: 6px; border-radius: 999px;
      background: #10161c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 99;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .switcher button {
      border: 0; background: #253038; color: #e8eef3;
      border-radius: 999px; min-height: 30px; padding: 0 12px;
      font-family: inherit; font-size: 0.78rem; font-weight: 600;
    }
    .switcher .label { padding: 0 12px; color: #e8eef3; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .switcher .on { background: #2674a6; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="light"></div><div class="light"></div><div class="light"></div>
      <span>Slugtale Settings — 480×520</span>
    </div>
    <div id="viewport" class="viewport"></div>
  </div>

  <div class="switcher">
    <button id="prev" type="button" aria-label="Previous variant">←</button>
    <span id="label" class="label"></span>
    <button id="next" type="button" aria-label="Next variant">→</button>
    <button id="theme" type="button" class="on"></button>
    <button id="scenario" type="button" class="on"></button>
  </div>

  <script>
    // ---------- icons (Lucide, ISC — same inline approach as index.html) ----------
    const ICONS = {
      activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
      keyboard: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/>',
      cpu: '<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>',
      sliders: '<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
    };
    const icon = (name, cls = "icon") =>
      `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;

    // ---------- fixtures ----------
    const SCENARIOS = {
      fresh: {
        label: "first run",
        hotkey: null,
        activation_mode: "toggle",
        speed_profile: "balanced",
        launch_at_login: false,
        model: { id: "base.en", present: false, mb: 148, path: "~/Library/Application Support/com.slugtale.desktop/models/ggml-base.en.bin" },
        items: [
          { id: "microphone", label: "Microphone permission", ready: false, required: true,
            detail: "Allow Slugtale to capture audio in Privacy & Security.", action: "Open Privacy" },
          { id: "text_insertion", label: "Text insertion permission", ready: false, required: true,
            detail: "Allow Slugtale to write into the current text target.", action: "Open Accessibility" },
          { id: "hotkey", label: "Hotkey", ready: false, required: true,
            detail: "Choose the hotkey that starts dictation.", pane: "dictation" },
          { id: "local_model", label: "Local model", ready: false, required: true,
            detail: "Download base.en before transcription can run.", pane: "model" },
          { id: "launch_at_login", label: "Launch at login", ready: true, required: false }
        ]
      },
      ready: {
        label: "configured",
        hotkey: "Cmd+Shift+D",
        activation_mode: "toggle",
        speed_profile: "balanced",
        launch_at_login: true,
        model: { id: "base.en", present: true, mb: 148, path: "~/Library/Application Support/com.slugtale.desktop/models/ggml-base.en.bin" },
        items: [
          { id: "microphone", label: "Microphone permission", ready: true, required: true },
          { id: "text_insertion", label: "Text insertion permission", ready: true, required: true },
          { id: "hotkey", label: "Hotkey", ready: true, required: true },
          { id: "local_model", label: "Local model", ready: true, required: true },
          { id: "launch_at_login", label: "Launch at login", ready: true, required: false }
        ]
      }
    };

    const MODE_LABEL = { toggle: "Toggle to dictate", hold: "Hold to dictate" };
    const SPEED_LABEL = { fast: "Fast", balanced: "Balanced", accurate: "Accurate" };
    const isReady = (s) => s.items.every((i) => i.ready || !i.required);
    const blockers = (s) => s.items.filter((i) => i.required && !i.ready);

    function keycaps(hotkey, big = false) {
      if (!hotkey) return `<span class="muted">Not set</span>`;
      const glyph = { Cmd: "⌘", Ctrl: "⌃", Alt: "⌥", Shift: "⇧" };
      return `<span class="keys${big ? " big" : ""}">${hotkey.split("+").map((k) => `<kbd>${glyph[k] || k}</kbd>`).join("")}</span>`;
    }

    const modeOptions = (s) => `
      <option${s.activation_mode === "toggle" ? " selected" : ""}>Toggle to dictate</option>
      <option${s.activation_mode === "hold" ? " selected" : ""}>Hold to dictate</option>`;
    const speedOptions = (s, long = true) => `
      <option${s.speed_profile === "fast" ? " selected" : ""}>Fast${long ? " — quickest, less accurate" : ""}</option>
      <option${s.speed_profile === "balanced" ? " selected" : ""}>Balanced${long ? " — recommended" : ""}</option>
      <option${s.speed_profile === "accurate" ? " selected" : ""}>Accurate${long ? " — slowest, most accurate" : ""}</option>`;
    const fixButton = (item) => item.action
      ? `<button type="button">${item.action}</button>`
      : `<button type="button" data-tab="${item.pane}">Set up</button>`;

    const TABS = [
      { id: "status", label: "Status", icon: "activity", hint: "⌘1" },
      { id: "dictation", label: "Dictation", icon: "keyboard", hint: "⌘2" },
      { id: "model", label: "Model", icon: "cpu", hint: "⌘3" },
      { id: "general", label: "General", icon: "sliders", hint: "⌘4" }
    ];
    const badgeFor = (s, id) =>
      (id === "status" && blockers(s).length > 0) ||
      (id === "model" && !s.model.present) ||
      (id === "dictation" && !s.hotkey);

    // ---------- B0 — round 1, kept for comparison ----------
    const B0 = {
      name: "Two-pane (round 1)",
      render(s, ui) {
        const tab = ui.tab || (isReady(s) ? "dictation" : "status");
        const panes = {
          status: `<h2>Status</h2><div>${s.items.map((i) => `
            <div class="b0-check">
              <span class="dot" data-state="${i.ready ? "ok" : i.required ? "warn" : ""}">${i.ready ? "✓" : i.required ? "!" : "–"}</span>
              <span>${i.label}<br /><span class="muted">${i.ready ? "Ready" : i.required ? "Action needed" : "Optional"}</span></span>
              ${!i.ready ? fixButton(i) : ""}
            </div>`).join("")}</div>`,
          dictation: `
            <h2>Dictation</h2>
            <label class="b0-field">Hotkey<input type="text" placeholder="Click and press a shortcut" value="${s.hotkey || ""}" /></label>
            <label class="b0-field">Activation mode<select>${modeOptions(s)}</select></label>
            <label class="b0-field">Speed vs. accuracy<select>${speedOptions(s)}</select></label>
            <p class="muted" style="margin:0">Applies to every dictation.</p>`,
          model: `
            <h2>Model</h2>
            <div class="b0-card">
              <div style="display:flex;justify-content:space-between;align-items:baseline">
                <strong>${s.model.id}</strong>
                <span class="muted" style="font-weight:600;${s.model.present ? "color:var(--ok-text)" : ""}">${s.model.present ? `Ready · ${s.model.mb} MB` : "Not downloaded"}</span>
              </div>
              <code class="muted" style="font-family:ui-monospace,monospace;overflow-wrap:anywhere">${s.model.path}</code>
              <div style="display:flex;gap:7px;flex-wrap:wrap">
                ${s.model.present ? `<button type="button">Show in Finder</button><button type="button" class="danger">Delete</button>`
                                  : `<button type="button" class="primary">Download ${s.model.id}</button>`}
              </div>
            </div>
            <p class="muted" style="margin:0">Captured audio and transcriptions stay on this machine.</p>`,
          general: `
            <h2>General</h2>
            <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:0.86rem">
              Launch at login<input type="checkbox"${s.launch_at_login ? " checked" : ""} />
            </label>
            <p class="muted" style="margin:0">Start Slugtale automatically when you sign in.</p>`
        };
        return `
        <div class="b0-wrap">
          <div class="b0-side">
            <div class="b0-brand">Slugtale</div>
            ${TABS.map((t) => `
              <button class="b0-nav" type="button" data-tab="${t.id}" aria-current="${tab === t.id}">
                ${t.label}${badgeFor(s, t.id) ? '<span class="b0-badge"></span>' : ""}
              </button>`).join("")}
            <div class="b0-foot"><span class="pill" data-ready="${isReady(s)}">${isReady(s) ? "Ready" : "Not ready"}</span></div>
          </div>
          <div class="b0-pane">${panes[tab]}</div>
        </div>`;
      }
    };

    // ---------- B1 — inset grouped rows, current-generation macOS ----------
    // Sidebar gets icons; the content pane drops per-control cards in favour of
    // grouped rows with the control on the right — the shape Ventura+ System
    // Settings uses, so it reads as native rather than as a web page.
    const B1 = {
      name: "Inset grouped",
      render(s, ui) {
        const tab = ui.tab || (isReady(s) ? "dictation" : "status");
        const panes = {
          status: `
            ${blockers(s).length ? `<div class="b1-caption">Needs attention</div>
              <div style="display:grid;gap:6px">
                ${blockers(s).map((b) => `<div class="warn-row"><div><strong>${b.label}</strong><small>${b.detail}</small></div>${fixButton(b)}</div>`).join("")}
              </div>` : ""}
            ${/* Only items that are NOT in "Needs attention" get listed below —
                  otherwise the pane states every blocker twice, which is the
                  duplication this redesign exists to remove. */""}
            <div class="b1-caption">${blockers(s).length ? "Already set" : "All checks"}</div>
            <div class="b1-group">
              ${s.items.filter((i) => !blockers(s).includes(i)).map((i) => `
                <div class="b1-row">
                  <span class="label">${i.label}</span>
                  <span class="pill" data-ready="${i.ready}">${i.ready ? (i.required ? "Ready" : "Optional") : "Action needed"}</span>
                </div>`).join("")}
            </div>`,
          dictation: `
            <div class="b1-caption">Hotkey</div>
            <div class="b1-group">
              <div class="b1-row">
                <span class="label">Shortcut<span class="sub">While another app has focus</span></span>
                ${s.hotkey ? `<span style="display:flex;gap:8px;align-items:center">${keycaps(s.hotkey)}<button type="button" class="ghost">Change</button></span>`
                           : `<button type="button" class="primary">Record shortcut</button>`}
              </div>
              <div class="b1-row">
                <span class="label">Activation<span class="sub">${MODE_LABEL[s.activation_mode]}</span></span>
                <select>${modeOptions(s)}</select>
              </div>
            </div>
            <div class="b1-caption">Transcription</div>
            <div class="b1-group">
              <div class="b1-row">
                <span class="label">Speed vs. accuracy</span>
                <select>${speedOptions(s, false)}</select>
              </div>
            </div>
            <p class="b1-note">Applies to every dictation.</p>`,
          model: `
            <div class="b1-caption">Local model</div>
            <div class="b1-group">
              <div class="b1-row">
                <span class="label">${s.model.id}<span class="sub">${s.model.present ? `Installed · ${s.model.mb} MB` : `${s.model.mb} MB download`}</span></span>
                ${s.model.present ? `<span class="pill" data-ready="true">Ready</span>`
                                  : `<button type="button" class="primary">Download</button>`}
              </div>
              ${s.model.present ? `
              <div class="b1-row">
                <span class="label">Location<span class="sub mono" style="overflow-wrap:anywhere">${s.model.path}</span></span>
                <button type="button" class="ghost">Reveal</button>
              </div>
              <div class="b1-row">
                <span class="label">Remove model<span class="sub">Frees ${s.model.mb} MB. Dictation stops working.</span></span>
                <button type="button" class="danger">Delete</button>
              </div>` : ""}
            </div>
            <p class="b1-note">Captured audio and transcriptions stay on this machine.</p>`,
          general: `
            <div class="b1-caption">Startup</div>
            <div class="b1-group">
              <div class="b1-row">
                <span class="label">Launch at login<span class="sub">Start Slugtale when you sign in</span></span>
                <input type="checkbox"${s.launch_at_login ? " checked" : ""} />
              </div>
            </div>
            <div class="b1-caption">Appearance</div>
            <div class="b1-group">
              <div class="b1-row">
                <span class="label">Theme<span class="sub">Follows the system by default</span></span>
                <select><option>Automatic</option><option>Light</option><option>Dark</option></select>
              </div>
            </div>`
        };
        return `
        <div class="b1-wrap">
          <nav class="b1-side">
            ${TABS.map((t) => `
              <button class="b1-nav" type="button" data-tab="${t.id}" aria-current="${tab === t.id}">
                ${icon(t.icon)}<span>${t.label}</span>${badgeFor(s, t.id) ? '<span class="b1-badge"></span>' : ""}
              </button>`).join("")}
            <footer><span class="pill" data-ready="${isReady(s)}">${isReady(s) ? "Ready" : `${blockers(s).length} to fix`}</span></footer>
          </nav>
          <div class="b1-main">
            <div class="b1-toolbar">
              <h2>${TABS.find((t) => t.id === tab).label}</h2>
              ${/* The hotkey rides in the toolbar as an ambient reminder, except on
                    the pane that already shows it. */""}
              ${isReady(s) && s.hotkey && tab !== "dictation" ? keycaps(s.hotkey) : ""}
            </div>
            <div class="b1-scroll">${panes[tab]}</div>
          </div>
        </div>`;
      }
    };

    // ---------- B2 — icon rail + editorial content ----------
    // The rail costs 62px instead of 148px, so the content column gets big type
    // and breathing room. Status stops being a tab: when something is wrong it
    // rides at the top of whichever pane you are on.
    const B2 = {
      name: "Icon rail",
      render(s, ui) {
        const tab = ui.tab || "dictation";
        const blocker = blockers(s)[0];
        const heads = {
          status: ["Status", "Everything Slugtale needs to dictate."],
          dictation: ["Dictation", isReady(s) ? "Press your hotkey in any app." : "Set a hotkey to start dictating."],
          model: ["Model", "Runs locally. Nothing leaves this machine."],
          general: ["General", "How Slugtale behaves in the background."]
        };
        const panes = {
          status: s.items.map((i) => `
            <div class="b2-line">
              <span class="label">${i.label}<span class="sub">${i.ready ? (i.required ? "Ready" : "Optional") : i.detail}</span></span>
              ${i.ready ? `<span class="pill" data-ready="true">OK</span>` : fixButton(i)}
            </div>`).join(""),
          dictation: `
            <div class="b2-line">
              <span class="label">Shortcut<span class="sub">Works while another app has focus</span></span>
              ${s.hotkey ? `<span style="display:flex;gap:9px;align-items:center">${keycaps(s.hotkey)}<button type="button" class="ghost">Change</button></span>`
                         : `<button type="button" class="primary">Record</button>`}
            </div>
            <div class="b2-line">
              <span class="label">Activation<span class="sub">How the hotkey behaves</span></span>
              <div class="b2-seg">
                <button type="button" aria-pressed="${s.activation_mode === "toggle"}">Toggle</button>
                <button type="button" aria-pressed="${s.activation_mode === "hold"}">Hold</button>
              </div>
            </div>
            <div class="b2-line">
              <span class="label">Speed vs. accuracy<span class="sub">Applies to every dictation</span></span>
              <div class="b2-seg">
                <button type="button" aria-pressed="${s.speed_profile === "fast"}">Fast</button>
                <button type="button" aria-pressed="${s.speed_profile === "balanced"}">Balanced</button>
                <button type="button" aria-pressed="${s.speed_profile === "accurate"}">Accurate</button>
              </div>
            </div>`,
          model: `
            <div class="b2-hero">
              ${icon("cpu", "icon")}
              <span class="grow"><strong>${s.model.id}</strong><span class="sub muted">${s.model.present ? `Installed · ${s.model.mb} MB` : `Not downloaded · ${s.model.mb} MB`}</span></span>
              ${s.model.present ? `<span class="pill" data-ready="true">Ready</span>` : `<button type="button" class="primary">Download</button>`}
            </div>
            ${s.model.present ? `
            <div class="b2-line">
              <span class="label">Location<span class="sub" style="overflow-wrap:anywhere">${s.model.path}</span></span>
              <button type="button" class="ghost">Reveal</button>
            </div>
            <div class="b2-line">
              <span class="label">Remove model<span class="sub">Frees ${s.model.mb} MB</span></span>
              <button type="button" class="danger">Delete</button>
            </div>` : ""}`,
          general: `
            <div class="b2-line">
              <span class="label">Launch at login<span class="sub">Start Slugtale when you sign in</span></span>
              <input type="checkbox"${s.launch_at_login ? " checked" : ""} />
            </div>
            <div class="b2-line">
              <span class="label">Theme<span class="sub">Follows the system by default</span></span>
              <div class="b2-seg">
                <button type="button" aria-pressed="true">Auto</button>
                <button type="button" aria-pressed="false">Light</button>
                <button type="button" aria-pressed="false">Dark</button>
              </div>
            </div>`
        };
        return `
        <div class="b2-wrap">
          <nav class="b2-rail">
            ${TABS.map((t) => `
              <button class="b2-tab" type="button" data-tab="${t.id}" aria-current="${tab === t.id}">
                ${icon(t.icon)}<span>${t.label}</span>${badgeFor(s, t.id) ? '<span class="b2-badge"></span>' : ""}
              </button>`).join("")}
            <footer><button class="b2-theme" type="button" title="Theme">${icon("moon")}</button></footer>
          </nav>
          <div class="b2-main">
            <div class="b2-head">
              <h2>${heads[tab][0]}</h2>
              <p>${heads[tab][1]}</p>
            </div>
            <div class="b2-scroll">
              ${blocker && tab !== "status" ? `<div class="warn-row" style="margin-bottom:12px"><div><strong>${blocker.label}</strong><small>${blocker.detail}</small></div>${fixButton(blocker)}</div>` : ""}
              ${panes[tab]}
            </div>
          </div>
        </div>`;
      }
    };

    // ---------- B3 — dense pro + ambient status bar ----------
    // Sidebar is grouped and keyboard-hinted; controls sit on hover-revealed
    // rows. Readiness leaves the panes entirely and becomes a permanent status
    // bar along the bottom, the way an editor shows branch and errors.
    const B3 = {
      name: "Dense + status bar",
      render(s, ui) {
        const tab = ui.tab || (isReady(s) ? "dictation" : "status");
        const row = (label, value, control = "") =>
          `<div class="b3-row"><dt>${label}</dt><dd>${value}${control}</dd></div>`;
        const panes = {
          status: `<h2>Status</h2><dl style="margin:0">${s.items.map((i) => row(
            i.label,
            `<span class="${i.ready ? "" : "mono"}" style="${i.ready ? "color:var(--ok-text)" : "color:var(--warn-text)"}">${i.ready ? "ready" : i.required ? "action needed" : "optional"}</span>`,
            i.ready ? "" : fixButton(i)
          )).join("")}</dl>`,
          dictation: `<h2>Dictation</h2><dl style="margin:0">
            ${row("Hotkey", s.hotkey ? keycaps(s.hotkey) : `<span class="mono">unset</span>`, `<button type="button">${s.hotkey ? "Change" : "Record"}</button>`)}
            ${row("Activation", `<select>${modeOptions(s)}</select>`)}
            ${row("Speed", `<select>${speedOptions(s, false)}</select>`)}
          </dl>`,
          model: `<h2>Model</h2><dl style="margin:0">
            ${row("Model", s.model.id, s.model.present ? `<button type="button" class="danger">Delete</button>` : `<button type="button" class="primary">Download</button>`)}
            ${row("Size", `<span class="mono">${s.model.mb} MB</span>`)}
            ${row("State", `<span style="color:${s.model.present ? "var(--ok-text)" : "var(--warn-text)"}">${s.model.present ? "installed" : "not downloaded"}</span>`)}
            ${row("Path", `<span class="mono">${s.model.path}</span>`, `<button type="button">Reveal</button>`)}
          </dl>
          <p class="muted" style="margin:10px 0 0">Captured audio and transcriptions stay on this machine.</p>`,
          general: `<h2>General</h2><dl style="margin:0">
            ${row("Launch at login", `<input type="checkbox"${s.launch_at_login ? " checked" : ""} />`)}
            ${row("Theme", `<select><option>Automatic</option><option>Light</option><option>Dark</option></select>`)}
          </dl>`
        };
        return `
        <div class="b3-wrap">
          <div class="b3-body">
            <nav class="b3-side">
              <div class="b3-group">
                <div class="b3-grouphead">Slugtale</div>
                ${TABS.slice(0, 1).map((t) => `
                  <button class="b3-nav" type="button" data-tab="${t.id}" aria-current="${tab === t.id}">
                    ${t.label}${badgeFor(s, t.id) ? '<span class="b3-badge"></span>' : `<span class="hint">${t.hint}</span>`}
                  </button>`).join("")}
              </div>
              <div class="b3-group">
                <div class="b3-grouphead">Setup</div>
                ${TABS.slice(1, 3).map((t) => `
                  <button class="b3-nav" type="button" data-tab="${t.id}" aria-current="${tab === t.id}">
                    ${t.label}${badgeFor(s, t.id) ? '<span class="b3-badge"></span>' : `<span class="hint">${t.hint}</span>`}
                  </button>`).join("")}
              </div>
              <div class="b3-group">
                <div class="b3-grouphead">Preferences</div>
                ${TABS.slice(3).map((t) => `
                  <button class="b3-nav" type="button" data-tab="${t.id}" aria-current="${tab === t.id}">
                    ${t.label}<span class="hint">${t.hint}</span>
                  </button>`).join("")}
              </div>
            </nav>
            <div class="b3-pane">${panes[tab]}</div>
          </div>
          <div class="b3-status" data-ready="${isReady(s)}">
            <span class="live">${isReady(s) ? "ready" : `${blockers(s).length} blocked`}</span>
            <span class="sep">|</span>
            <span>${s.hotkey ? s.hotkey.replace(/Cmd/, "⌘").replace(/Shift/, "⇧").replace(/\+/g, "") : "no hotkey"}</span>
            <span class="sep">|</span>
            <span>${MODE_LABEL[s.activation_mode].split(" ")[0].toLowerCase()}</span>
            <span class="push">${s.model.present ? `${s.model.id} · ${SPEED_LABEL[s.speed_profile].toLowerCase()}` : "no model"}</span>
          </div>
        </div>`;
      }
    };

    // ---------- switcher plumbing ----------
    const VARIANTS = { B0, B1, B2, B3 };
    const KEYS = Object.keys(VARIANTS);
    const THEMES = ["auto", "light", "dark"];
    let ui = {};

    function params() {
      const p = new URLSearchParams(location.search);
      return {
        variant: KEYS.includes(p.get("variant")) ? p.get("variant") : "B1",
        state: SCENARIOS[p.get("state")] ? p.get("state") : "fresh",
        theme: THEMES.includes(p.get("theme")) ? p.get("theme") : "auto"
      };
    }

    function setParams(next) {
      const p = new URLSearchParams(location.search);
      Object.entries(next).forEach(([k, v]) => p.set(k, v));
      history.replaceState(null, "", `?${p}`);
      if (!("theme" in next)) ui = {};
      draw();
    }

    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

    function draw() {
      const { variant, state, theme } = params();
      const scenario = SCENARIOS[state];
      const resolved = theme === "auto" ? (prefersDark.matches ? "dark" : "light") : theme;

      document.documentElement.dataset.theme = resolved;
      document.getElementById("viewport").innerHTML = VARIANTS[variant].render(scenario, ui);
      document.getElementById("label").textContent = `${variant} — ${VARIANTS[variant].name}`;
      document.getElementById("theme").textContent = `theme: ${theme}${theme === "auto" ? ` (${resolved})` : ""}`;
      document.getElementById("scenario").textContent = `state: ${state}`;
      document.title = `PROTOTYPE ${variant} — ${VARIANTS[variant].name}`;
    }

    prefersDark.addEventListener("change", draw);

    function cycle(step) {
      const i = (KEYS.indexOf(params().variant) + step + KEYS.length) % KEYS.length;
      setParams({ variant: KEYS[i] });
    }
    function cycleTheme() {
      const i = (THEMES.indexOf(params().theme) + 1) % THEMES.length;
      setParams({ theme: THEMES[i] });
    }
    function toggleState() {
      setParams({ state: params().state === "fresh" ? "ready" : "fresh" });
    }

    document.getElementById("prev").addEventListener("click", () => cycle(-1));
    document.getElementById("next").addEventListener("click", () => cycle(1));
    document.getElementById("theme").addEventListener("click", cycleTheme);
    document.getElementById("scenario").addEventListener("click", toggleState);

    // Variant-local interaction: sidebar / rail tab selection.
    document.getElementById("viewport").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab]");
      if (tab) {
        ui.tab = tab.dataset.tab;
        draw();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea, select, [contenteditable]")) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
      if (event.key.toLowerCase() === "s") toggleState();
      if (event.key.toLowerCase() === "d") cycleTheme();
    });

    window.addEventListener("popstate", draw);
    draw();
  </script>
</body>
</html>
